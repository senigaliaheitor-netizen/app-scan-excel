<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan para Google Planilhas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex flex-col items-center">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 flex flex-col items-center space-y-6 mt-6">
        <h1 class="text-2xl font-bold text-slate-800 text-center">Scan para Google Planilhas</h1>
        <p class="text-sm text-slate-500 text-center">Tire uma foto ou envie imagens da galeria para extrair os dados do rótulo direto na sua conta do Google.</p>

        <!-- Chave Gemini: digitada pelo usuário, guardada só neste navegador -->
        <div class="w-full space-y-2">
            <label for="gemini-key" class="text-xs font-semibold text-slate-600">Sua chave da API Gemini</label>
            <div class="flex space-x-2">
                <input id="gemini-key" type="password" autocomplete="off" placeholder="Cole sua chave aqui"
                       class="flex-1 min-w-0 border border-slate-300 rounded-lg px-3 py-2 text-sm">
                <button type="button" onclick="toggleKey()" class="px-3 py-2 text-xs bg-slate-200 hover:bg-slate-300 rounded-lg">👁</button>
                <button type="button" onclick="saveKey()" class="px-3 py-2 text-xs bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-semibold">Salvar</button>
            </div>
            <p id="key-status" class="text-xs text-slate-500">
                A chave fica salva apenas neste navegador e nunca é enviada para o código do site.
                Crie uma em <a class="text-blue-600 underline" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>.
            </p>
        </div>

        <!-- Login -->
        <div id="auth-section" class="w-full flex flex-col items-center space-y-3">
            <button id="authorize_button" onclick="handleAuthClick()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-6 rounded-xl flex items-center justify-center space-x-2 w-full transition shadow cursor-pointer">
                <span id="auth_button_text">Conectar com Google</span>
            </button>
            <p id="auth-status" class="text-xs text-slate-500 text-center"></p>
        </div>

        <!-- Captura -->
        <div id="capture-section" class="w-full flex flex-col items-center space-y-4 hidden">
            <p id="user-info" class="text-xs text-green-600 font-semibold"></p>

            <label class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl flex items-center justify-center cursor-pointer transition shadow text-lg">
                <span>📸 Tirar Foto</span>
                <input type="file" accept="image/*" capture="environment" id="camera-input" class="hidden" onchange="processFiles(event)">
            </label>

            <label class="w-full bg-violet-600 hover:bg-violet-700 text-white font-bold py-4 rounded-xl flex items-center justify-center cursor-pointer transition shadow text-lg">
                <span>🖼️ Enviar da Galeria</span>
                <input type="file" accept="image/*" multiple id="gallery-input" class="hidden" onchange="processFiles(event)">
            </label>

            <div id="preview-container" class="w-full hidden">
                <img id="image-preview" class="w-full rounded-lg border border-slate-200 shadow-inner max-h-64 object-cover" alt="Pré-visualização">
            </div>

            <div id="status" class="text-sm font-medium text-slate-600 text-center leading-relaxed w-full"></div>
        </div>
    </div>

    <script>
        const CLIENT_ID = '558756318293-303rltbv0jo3r61t9t9btri571gsiuv8.apps.googleusercontent.com';
        const GEMINI_MODEL = 'gemini-3.8-flash';
        const SCOPES = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file';

        let tokenClient;
        let accessToken = null;
        let busy = false;

        function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
        function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

        /* ---------- Chave Gemini (só no navegador) ---------- */
        function getKey() {
            return document.getElementById('gemini-key').value.trim() || load('gemini_key') || '';
        }
        function saveKey() {
            const v = document.getElementById('gemini-key').value.trim();
            const el = document.getElementById('key-status');
            if (!v) {
                el.innerHTML = '<span class="text-red-500">Cole a chave antes de salvar.</span>';
                return;
            }
            store('gemini_key', v);
            el.innerHTML = '<span class="text-green-600">✅ Chave salva neste navegador.</span>';
        }
        function toggleKey() {
            const i = document.getElementById('gemini-key');
            i.type = i.type === 'password' ? 'text' : 'password';
        }
        document.getElementById('gemini-key').value = load('gemini_key') || '';

        /* ---------- Login Google ---------- */
        function initGoogleAuth() {
            if (!(window.google && google.accounts && google.accounts.oauth2)) return;
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (resp) => {
                    if (resp && resp.access_token) {
                        accessToken = resp.access_token;
                        document.getElementById('auth-section').classList.add('hidden');
                        document.getElementById('capture-section').classList.remove('hidden');
                        document.getElementById('user-info').innerText = '✅ Conta do Google Conectada!';
                    } else if (resp && resp.error) {
                        document.getElementById('auth-status').innerHTML =
                            `<span class="text-red-500">Erro: ${resp.error_description || resp.error}</span>`;
                    }
                },
            });
        }

        function handleAuthClick() {
            const statusEl = document.getElementById('auth-status');
            if (!tokenClient) initGoogleAuth();
            if (!tokenClient) {
                statusEl.innerText = 'Aguarde o carregamento do serviço Google...';
                return;
            }
            statusEl.innerText = 'Abrindo autenticação...';
            tokenClient.requestAccessToken({ prompt: '' });
        }

        /* ---------- Utilitários ---------- */
        function escapeHtml(t) {
            return String(t ?? '').replace(/[&<>"']/g, c =>
                ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function convertBase64(file) {
            return new Promise((resolve, reject) => {
                const r = new FileReader();
                r.onload = () => resolve(r.result);
                r.onerror = reject;
                r.readAsDataURL(file);
            });
        }

        /* ---------- Processamento (câmera ou galeria, 1 ou várias fotos) ---------- */
        async function processFiles(event) {
            const files = Array.from(event.target.files || []);
            event.target.value = '';
            if (!files.length || busy) return;

            const status = document.getElementById('status');
            const key = getKey();
            if (!key) {
                status.innerHTML = '<span class="text-red-500">❌ Cole sua chave da API Gemini no campo acima e clique em Salvar.</span>';
                return;
            }

            busy = true;
            const results = [];
            for (let i = 0; i < files.length; i++) {
                const label = files.length > 1 ? ` (${i + 1}/${files.length})` : '';
                try {
                    const data = await processOne(files[i], key, label);
                    results.push(`✅ <b>${escapeHtml(data.nome)}</b> — validade ${escapeHtml(data.validade)}, lote ${escapeHtml(data.lote)}`);
                } catch (error) {
                    console.error(error);
                    results.push(`<span class="text-red-500">❌ ${escapeHtml(files[i].name || 'foto')}: ${escapeHtml(error.message)}</span>`);
                }
            }
            status.innerHTML = `🎉 <b>Concluído!</b> Dados enviados para a planilha <b>'Dados Extraídos - IA'</b> no seu Google Drive.<br><br>` +
                results.join('<br>');
            busy = false;
        }

        async function processOne(file, key, label) {
            const status = document.getElementById('status');
            document.getElementById('image-preview').src = URL.createObjectURL(file);
            document.getElementById('preview-container').classList.remove('hidden');
            status.innerHTML = `⏳ Analisando imagem com IA...${label}`;

            const base64Image = await convertBase64(file);
            const pureBase64 = base64Image.split(',')[1];

            const promptText = `Analise este rótulo de produto e extraia TODAS as informações abaixo.
Retorne estritamente em formato JSON válido com as seguintes chaves:
{
  "nome": "Nome do produto ou substância",
  "validade": "Data de validade",
  "lote": "Lote de fabricação",
  "fabricante": "Nome do fabricante",
  "obs": "Observações ou --- caso não haja",
  "codigo": "Código numérico do produto/código de barras"
}
Se algum campo não for identificado na imagem, preencha o valor com "N/A".`;

            const geminiResponse = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-goog-api-key': key
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: promptText },
                            { inline_data: { mime_type: file.type || 'image/jpeg', data: pureBase64 } }
                        ]
                    }],
                    generationConfig: { responseMimeType: 'application/json' }
                })
            });

            const geminiData = await geminiResponse.json();
            if (geminiData.error) throw new Error(`Gemini: ${geminiData.error.message}`);

            const parts = geminiData.candidates?.[0]?.content?.parts;
            if (!parts || !parts[0]?.text) {
                throw new Error('A IA não retornou um resultado válido. Tente com boa iluminação.');
            }

            const cleanJsonText = parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
            const data = JSON.parse(cleanJsonText);

            status.innerHTML = `⏳ Salvando na planilha Google...${label}`;
            await saveToUserGoogleSheet(data);
            return data;
        }

        /* ---------- Google Planilhas ---------- */
        async function sheetsFetch(url, body) {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const json = await res.json();
            if (json.error) {
                if (json.error.code === 401) {
                    throw new Error('Sessão do Google expirou. Recarregue a página e conecte de novo.');
                }
                throw new Error(`Sheets: ${json.error.message}`);
            }
            return json;
        }

        async function saveToUserGoogleSheet(data) {
            let spreadsheetId = load('user_spreadsheet_id');
            const appendUrl = (id) =>
                `https://sheets.googleapis.com/v4/spreadsheets/${id}/values/Dados!A1:F1:append?valueInputOption=USER_ENTERED`;

            if (!spreadsheetId) {
                const created = await sheetsFetch('https://sheets.googleapis.com/v4/spreadsheets', {
                    properties: { title: 'Dados Extraídos - IA' },
                    sheets: [{ properties: { title: 'Dados' } }]
                });
                spreadsheetId = created.spreadsheetId;
                store('user_spreadsheet_id', spreadsheetId);

                await sheetsFetch(appendUrl(spreadsheetId), {
                    values: [["Nome do Produto", "Data de Validade", "Lote", "Fabricante", "OBS", "Código do Produto"]]
                });
            }

            await sheetsFetch(appendUrl(spreadsheetId), {
                values: [[
                    data.nome || "N/A", data.validade || "N/A", data.lote || "N/A",
                    data.fabricante || "N/A", data.obs || "N/A", data.codigo || "N/A"
                ]]
            });
        }
    </script>
    <!-- Carregado depois das funções, para o onload sempre achar initGoogleAuth -->
    <script src="https://accounts.google.com/gsi/client" async defer onload="initGoogleAuth()"></script>
</body>
</html>
